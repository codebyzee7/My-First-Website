<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meri Pehli Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
        }
        header {
            background-color: #2b5876;
            color: white;
            padding: 40px 20px;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
        }
        p {
            font-size: 1.2em;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #4e65ff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #92 narrow;
            background-color: #3b4cca;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website!</h1>
        <p>Yeh meri GitHub par pehli website hai.</p>
    </header>

    <div class="container">
        <h2>Mere Baare Mein</h2>
        <p>Main GitHub par apni website banana seekh raha/rahi hoon. Yeh bilkul free aur aasan hai!</p>
        <a href="https://github.com" class="btn" target="_blank">Mera GitHub Profile</a>
    </div>

</body>
</html>
